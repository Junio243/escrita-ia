name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest
        run: |
          node -e "const m=require('./manifest.json'); for (const k of ['manifest_version','name','version','background','content_scripts']) { if (!m[k]) throw new Error('manifest: missing '+k); } console.log('manifest', m.version, 'ok');"
      - name: Tests
        run: npm test
      - run: npm ci
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - name: Browser demo tests
        run: npm run test:site
      - name: Real extension browser tests
        run: npm run test:browser
